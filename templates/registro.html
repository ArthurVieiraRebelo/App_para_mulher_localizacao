<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Segura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #d946ef 0%, #9333ea 100%);
            min-height: 100vh;
        }
    </style>
</head>

<body class="flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="text-6xl mb-2">🛡️</div>
            <h1 class="text-3xl font-bold text-white mb-2">Segura</h1>
            <p class="text-pink-100">Crie sua conta e mantenha-se segura</p>
        </div>

        <!-- Card de Registro -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 mb-4">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Criar Conta</h2>

            <!-- Formulário -->
            <form id="formRegistro" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" minlength="6" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none">
                    <p class="text-xs text-gray-500 mt-1">Mínimo 6 caracteres</p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar Senha</label>
                    <input type="password" id="senhaConfirm" name="senhaConfirm" placeholder="••••••••" minlength="6"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none">
                </div>

                <!-- Mensagens -->
                <div id="erro" class="p-3 bg-red-100 text-red-700 rounded-lg hidden"></div>
                <div id="sucesso" class="p-3 bg-green-100 text-green-700 rounded-lg hidden"></div>

                <button type="submit"
                    class="w-full bg-gradient-to-r from-pink-600 to-purple-600 text-white font-bold py-3 rounded-lg hover:from-pink-700 hover:to-purple-700 transition-all">
                    Criar Conta
                </button>
            </form>
        </div>

        <!-- Link para login -->
        <div class="text-center">
            <p class="text-white mb-3">Já tem conta?</p>
            <a href="/auth/login" class="text-white font-semibold underline hover:text-pink-100">
                Faça login aqui
            </a>
        </div>
    </div>

    <script>
        const formRegistro = document.getElementById('formRegistro');
        const erroEl = document.getElementById('erro');
        const sucessoEl = document.getElementById('sucesso');

        formRegistro.addEventListener('submit', async (e) => {
            e.preventDefault();

            erroEl.classList.add('hidden');
            sucessoEl.classList.add('hidden');

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const senhaConfirm = document.getElementById('senhaConfirm').value;
            const nome = document.getElementById('nome').value;

            // Validações
            if (senha !== senhaConfirm) {
                erroEl.textContent = '❌ As senhas não coincidem';
                erroEl.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch('/auth/registro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email,
                        senha,
                        nome
                    })
                });

                const dados = await response.json();

                if (response.ok) {
                    sucessoEl.textContent = '✅ ' + dados.mensagem;
                    sucessoEl.classList.remove('hidden');

                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1500);
                } else {
                    erroEl.textContent = '❌ ' + dados.erro;
                    erroEl.classList.remove('hidden');
                }
            } catch (erro) {
                erroEl.textContent = '❌ Erro: ' + erro.message;
                erroEl.classList.remove('hidden');
            }
        });
    </script>
</body>

</html>
